# Correctness gate: watertight is necessary but not sufficient — a petal can export with
# zero boundary edges and still be the WRONG SHAPE (as the un-clefted continuous-margin
# rim did, skipping every Lobed sinus — fixed in PR #50 by making ribPath the one producer of
# the boundary; this gate is what holds it fixed). tools/verify-geometry-quality.mjs measures margin
# fidelity, contour smoothness, and uncapped infill ends across the shape x pattern matrix
# plus every shipped preset by name. See CLAUDE.md and the flower-project skill.
#
# Fast enough (32 configs, ~24s on a 4-core box) to run the full matrix on every PR — no
# smoke/full split needed here, unlike the export-watertight gate. Known, tracked defects
# are xfail; none are open today, and the gate still fails if a debt goes stale, its config
# count exceeds the cap, or one unexpectedly starts passing (the ledger's own self-policing).
# Path-scoped generously (every geometry source AND tools/**) so a change to a dev tool or
# a preset can't silently skip this.
name: flower-geometry-quality

on:
  pull_request:
    paths:
      - flower.js
      - flower-geometry.js
      - flower-sdf.js
      - flower-presets.js
      - flower-registry.js
      - flower.html
      - 'tools/**'
      - .github/workflows/flower-geometry-quality.yml
  push:
    branches: [main]
    paths:
      - flower.js
      - flower-geometry.js
      - flower-sdf.js
      - flower-presets.js
      - flower-registry.js
      - flower.html
      - 'tools/**'
  workflow_dispatch: {}    # run on demand, no PR needed

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # playwright alone, at an exact version. It pins the exact playwright-core it
      # needs and npm hoists it, so the harness's `import 'playwright-core'` and the
      # browser that `npx playwright install` downloads can never disagree. Both
      # unpinned raced npm on Sep 4: playwright-core 1.63.0 published nineteen
      # seconds before a run while the playwright CLI was still 1.62.1, and every job
      # that launches a browser died at launch (build 1243 wanted, 1234 installed);
      # two minutes later the registry listed playwright 1.63.0 as latest with its
      # tarball still 404, and an unpinned install could not fetch it at all. Bump
      # the pin by hand, in every workflow at once, with playwright-core's twin in
      # bloom-frozen-matrices.yml.
      - name: Install render deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Petal shape x pattern correctness (full matrix + presets)
        run: node tools/verify-geometry-quality.mjs
