# Build gate: every control the bloom registry declares must be REACHABLE in
# the generated panel, and collapsing a section must not take it away.
#
# TWO ROUTES, and the reason this is its own workflow. The declaration route
# (a render census over the generated DOM) and the path route (driving a real
# input inside a COLLAPSED section and asserting the app rebuilt) catch
# different failures — the flower project shipped 25 unreachable controls
# through several releases with every geometry gate green, and separately
# shipped a panel that stopped re-running while every declaration stayed
# correct. Neither substitutes for the other; see the tool's header.
#
# WHY NOT FOLDED INTO AN EXISTING WORKFLOW. bloom-frozen-matrices is
# deliberately browser-free and finishes in seconds — the panel is generated
# by bloom.js at runtime, so a static parse cannot see it, and adding Chromium
# there would blur that workflow's subject and multiply its cost. The export
# and connectedness gates already carry a browser but run 125 rows for
# minutes; this is a handful of pages and belongs beside them, not inside them.
name: bloom-panel

on:
  pull_request:
    paths:
      - bloom.html
      - bloom.css
      - bloom.js
      - bloom-registry.js
      - bloom-geometry.js
      - tools/verify-bloom-panel.mjs
      - tools/bloom-harness.mjs
      - tools/chromium-harness.mjs
      - .github/workflows/bloom-panel.yml
  push:
    branches: [main]
    paths:
      - bloom.html
      - bloom.css
      - bloom.js
      - bloom-registry.js
      - bloom-geometry.js
      - tools/verify-bloom-panel.mjs
      - tools/bloom-harness.mjs
      - tools/chromium-harness.mjs
  workflow_dispatch: {}

# A SUPERSEDED COMMIT'S GREEN RUN SHOULD NEVER HAVE BEEN QUOTABLE (Eva,
# session 17). Two runs of this workflow on PR #149 started two minutes
# apart and both ran to completion on a four-CPU runner; the older one was
# already answering a question nobody was asking. The group is keyed to the
# workflow AND the ref so it can never cancel across PRs, and the final head
# always runs to completion — safe by construction. It also enforces a
# discipline already agreed: a run on a commit that has been superseded is
# not evidence about the head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # playwright alone, at an exact version. It pins the exact playwright-core it
      # needs and npm hoists it, so the harness's `import 'playwright-core'` and the
      # browser that `npx playwright install` downloads can never disagree. Both
      # unpinned raced npm on Sep 4: playwright-core 1.63.0 published nineteen
      # seconds before a run while the playwright CLI was still 1.62.1, and every job
      # that launches a browser died at launch (build 1243 wanted, 1234 installed);
      # two minutes later the registry listed playwright 1.63.0 as latest with its
      # tarball still 404, and an unpinned install could not fetch it at all. Bump
      # the pin by hand, in every workflow at once, with playwright-core's twin in
      # bloom-frozen-matrices.yml.
      - name: Install render deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Every control renders once and reacts from inside a collapsed section
        run: node tools/verify-bloom-panel.mjs
      # A check nobody has seen fail is a hope. This deletes a control's
      # wrapper and replaces another control with a listener-less clone, and
      # requires BOTH routes to observe their own failure.
      - name: The gate must fail when the panel is broken on purpose
        run: node tools/verify-bloom-panel.mjs --negative-control
