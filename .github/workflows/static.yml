# Workflow for validating and deploying static content to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the working branch
  push:
    branches: ["claude/eva-maskalenko-portfolio-qod1hn"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# A newer run for this branch should supersede an older one still
# in-flight, not queue behind it. The previous config here
# (group: "pages", cancel-in-progress: false) let a rapid string of
# pushes leave earlier runs stranded -- queued behind the github-pages
# environment's own deployment lock, showing as "waiting" indefinitely
# instead of being cleanly superseded, which is what actually made
# recent deploys pile up and stop reaching a green check. Scoping the
# group to this workflow + ref (rather than a bare static string) and
# turning cancel-in-progress back on fixes that: a new push now cancels
# the previous run for the same branch outright. Only one concurrency
# block, and it only ever matches runs of this workflow on this ref, so
# it can't affect an unrelated workflow or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This is a plain static site: no package manager, no bundler, no build
  # step. "validate" fills that same procedural role instead -- a fast,
  # dependency-free gate that fails the run (before anything deploys) if
  # an entry file is missing or the page's inline JavaScript doesn't
  # parse, so a broken commit shows up as a failed check here rather
  # than as a silently broken live site.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify entry files exist
        run: |
          set -e
          for f in index.html about.html field-notes.html lab.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Required entry file missing: $f"
              exit 1
            fi
          done
      - name: Validate inline JavaScript syntax
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const files = ['lab.html'];
            let failed = false;
            for (const file of files) {
              const html = fs.readFileSync(file, 'utf8');
              const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
              scripts.forEach((m, i) => {
                try {
                  new Function(m[1]);
                } catch (e) {
                  console.error('::error file=' + file + '::inline script ' + i + ' failed to parse: ' + e.message);
                  failed = true;
                }
              });
            }
            if (failed) process.exit(1);
          "

  # Single deploy job, gated on validate passing first.
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify artifact root before upload
        run: |
          set -e
          if [ ! -f "index.html" ]; then
            echo "::error::index.html not found at the artifact root -- refusing to deploy"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # No build step for this project -- the repository root itself
          # is the deployed site, not a generated output directory.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
