# Build gate: every WIRED control must be exactly as visible as its registry declaration
# says — visible <=> (Advanced OR tier:"standard") AND its predicate holds — in BOTH tiers,
# at every config in tools/visibility-matrix.mjs. See tools/verify-tier-visibility.mjs for
# what it measures and what it would miss.
#
# It grew from 25 assertions to ~11,000 when tier stopped being a FILTER on which controls
# got examined and became an INPUT to the expectation: the old form could not check a
# Standard-tier control in Standard mode at all, which is how a Standard control invisible
# at the default state passed. Runs in about a minute; no reason to make it conditional.
name: flower-tier-visibility

on:
  pull_request:
    paths:
      - flower.js
      - flower-registry.js
      - flower.html
      - tools/verify-tier-visibility.mjs
      - tools/dump-visibility.mjs
      - tools/visibility-matrix.mjs
      - tools/chromium-harness.mjs
      - .github/workflows/flower-tier-visibility.yml
  push:
    branches: [main]
    paths:
      - flower.js
      - flower-registry.js
      - flower.html
      - tools/verify-tier-visibility.mjs
      - tools/dump-visibility.mjs
      - tools/visibility-matrix.mjs
      - tools/chromium-harness.mjs

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # playwright alone: it pins the exact playwright-core it needs and npm hoists it,
      # so the harness's `import 'playwright-core'` and the browser that
      # `npx playwright install` downloads can never disagree. Installing both
      # unpinned raced npm: on Sep 4 playwright-core 1.63.0 published nineteen seconds
      # before a run while the playwright CLI was still 1.62.1, and every job
      # that launches a browser died at launch (build 1243 wanted, 1234 installed).
      - name: Install render deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Every wired control matches its declared visibility, both tiers, whole matrix
        run: node tools/verify-tier-visibility.mjs
      # Records every control's visibility across the whole matrix in both tiers. Not an
      # assertion — it is the instrument a behaviour-preserving change is diffed against,
      # and running it in CI proves the harness itself still works and every config in the
      # matrix still takes (read-back). It fails on a config the UI silently rewrites.
      - name: Visibility dump must run clean (read-back + predicate coverage)
        run: node tools/dump-visibility.mjs > /dev/null
