# Publish the frozen baselines' permanent refs. MANUAL ONLY — this workflow
# has no push or pull_request trigger and does nothing until someone clicks
# "Run workflow".
#
# WHY IT EXISTS. Every frozen baseline is verified against its own base
# commit, and a base commit is only kept alive by something pointing at it.
# All but one live on `main`; phase10's is a mid-PR commit of #140, which was
# reachable only while that PR's BRANCH existed. The branch was deleted and
# `bloom-frozen-matrices` went red at `fatal: invalid reference: 4f39118`.
# `main` is not a protected branch here either, so a force-push would orphan
# every other base the same way. Tagging converts N implicit dependencies on
# branch reachability into N explicit permanent refs, which closes the class
# rather than the one instance. The charter carries the rule this produced: a
# frozen baseline is taken at a commit on `main`, never at a branch head, and
# is tagged at freeze time.
#
# WHY A WORKFLOW RATHER THAN A LOCAL PUSH. tools/publish-frozen-tags.sh is
# the one owner of what this does and can be run from any clone that can
# push tags. A session cannot: the agent proxy it runs behind returns HTTP
# 403 on a tag ref push while ordinary branch pushes from the same session
# succeed. A runner has no such limit. This workflow adds no second copy of
# anything — it runs that script.
#
# ===================================================================
# READ THIS BEFORE CONCLUDING FROM A RED X THAT NOTHING WAS PUBLISHED
# ===================================================================
# Nine dispatches between Sep 5 and Sep 18 all showed a red X and were
# mis-recorded for two weeks as "it has never created a tag". IT HAD. Run 9
# (35295784427) created TWELVE — frozen/phase21 and frozen/phase24..phase34 —
# and the remote carries 30 of the 33 declared baselines today, phase10 among
# them, which is the only load-bearing one.
#
# What the red X meant is that THREE refs cannot be created by this credential
# at all: GitHub refuses to let a GitHub App token — which GITHUB_TOKEN is —
# push a ref it judges to create or update a file under .github/workflows, and
# **GITHUB_TOKEN CANNOT BE GRANTED `workflows` SCOPE**, so the permissions:
# block below is already as permissive as it can be and was never the problem.
# The script now declares those three by name and exits 0 on a run that
# publishes everything it can; it still fails on an UNDECLARED absence, and —
# new — on a tag left pointing at a superseded commit, which the old name-only
# verification could not see.
#
# THE VERDICT IS EXERCISED, NOT ARGUED. tools/publish-frozen-tags-selftest.sh
# drives the real script against a local remote whose `update` hook reproduces
# GitHub's per-ref refusal verbatim, and runs four must-fail controls. It runs
# below, before anything is pushed: a publisher whose verdict is not trusted
# is what produced the two-week misreading in the first place.
#
# **PRECONDITION (session 17): A `workflow_dispatch` WORKFLOW IS ONLY
# DISPATCHABLE ONCE ITS FILE IS ON THE DEFAULT BRANCH.** GitHub registers
# workflows from `main`, so while this file existed only on a PR branch it did
# not appear in the Actions UI at all and there was nothing to click. That is
# "shipped means reachable". Check the outcome the same way: by reading the
# tags (`git ls-remote --tags origin`), or by running this workflow with
# `check_only` set, which verifies and publishes nothing.
name: bloom-frozen-tags

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Verify the remote against the declared set and publish nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # creating refs is the whole job; nothing else is needed
                         # and nothing more is available — see the note above.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every base commit must be resolvable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The script reads FROZEN_BASE_COMMITS from the harness rather than
      # restating it, and the harness imports playwright-core at module load.
      # No browser is launched.
      - name: Install the harness's own deps (no browser download)
        run: npm i --no-save three@0.161.0 playwright-core@1.62.1
      - name: The verdict must be able to fail (seven cases, four of them must-fail)
        run: bash tools/publish-frozen-tags-selftest.sh
      - name: Tag every frozen baseline's base commit
        env:
          # Only for the git/refs fallback, which is tried ONLY for refs the
          # push could not create. It sends no tree, so it may not trip the
          # workflow-scope check that the push does; that has never been
          # tested, and the step prints whatever the API answers.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish-frozen-tags.sh ${{ inputs.check_only && '--check' || '' }}
