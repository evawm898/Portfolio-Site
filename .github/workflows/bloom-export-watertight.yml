# Print-safety gate for the Parametric Bloom (docs/bloom-charter.md): every
# config in the matrix must export as a watertight STL — the pass criterion is
# boundary edges === 0 and nothing else (nonManifold / shells are unrated
# diagnostics; see the tool's header). tools/verify-bloom-export.mjs does the
# actual check: headless Chromium, the real Get STL click, a real STL parse.
name: bloom-export-watertight

on:
  pull_request:
    paths:
      - bloom.html
      - bloom.css
      - bloom.js
      - bloom-geometry.js
      - bloom-registry.js
      - tools/verify-bloom-export.mjs
      - tools/bloom-export-shards.mjs
      - tools/bloom-wall-thickness.mjs
      - tools/bloom-combination-gate.mjs
      - tools/verify-bloom-tube.mjs
      - tools/verify-bloom-arc-stability.mjs
      - tools/verify-bloom-infill.mjs
      - tools/verify-bloom-rim-owner.mjs
      - tools/verify-bloom-hole-rim.mjs
      - tools/verify-bloom-infill-margin.mjs
      - tools/verify-bloom-infill-budget.mjs
      - tools/verify-bloom-stem-channel.mjs
      - tools/verify-bloom-stem-nodes.mjs
      - tools/bloom-sagitta.mjs
      - tools/bloom-harness.mjs
      - tools/bloom-self-intersection.mjs
      - tools/verify-bloom-census-adjacency.mjs
      - tools/chromium-harness.mjs
      # THE SIX THE GATE REACHES THROUGH IMPORTS (C19, the gate-coverage
      # session). None runs from a `run:` line; every one is live in this job:
      #   bloom-crowding            <- verify-bloom-export (the crowding flag's
      #                                own R1 validity assertion on every row)
      #   bloom-first-slot          <- bloom-harness (the L family's Node-side
      #                                rebuild) and verify-bloom-infill
      #   bloom-infill-wall         <- verify-bloom-infill (I11) and
      #                                bloom-combination-gate
      #   bloom-plan-coverage       <- verify-bloom-export (coverage R1 on
      #                                every row, asserted on the incurve rows)
      #   bloom-rim-roundness-lib   <- verify-bloom-infill (I12)
      #   bloom-solid-angle-coverage<- verify-bloom-export (solid R1/R5 on
      #                                every row)
      # An edit to any one of them alone ran this gate on nothing; each has a
      # must-fail in docs/bloom-gate-coverage-outcome.md, per tool.
      - tools/bloom-crowding.mjs
      - tools/bloom-first-slot.mjs
      - tools/bloom-infill-wall.mjs
      - tools/bloom-plan-coverage.mjs
      - tools/bloom-rim-roundness-lib.mjs
      - tools/bloom-solid-angle-coverage.mjs
      # THE D14 GATES the `gates` job runs, and the mutant table whose anchors it checks.
      - tools/verify-bloom-leaf-decoupled.mjs
      - tools/verify-bloom-sepal-decoupled.mjs
      - tools/verify-bloom-surface-offstation.mjs
      - tools/verify-bloom-rim-arc.mjs
      - tools/verify-bloom-infill-conform.mjs
      - tools/verify-bloom-infill-metric.mjs
      - tools/verify-bloom-edge-profile.mjs
      - tools/verify-bloom-apex-mutants.mjs
      # The mutant table IS listed now (the gate-coverage session): its full
      # sweep lives in bloom-apex-mutants.yml, and what runs HERE on a table
      # edit is the `gates` job's anchor pre-check — seconds. The old reason
      # for leaving it out (a three-hour gate behind every table edit) still
      # holds for the matrix, which is why `gates` and not `shard` reads it.
      - .github/workflows/bloom-export-watertight.yml
  push:
    branches: [main]
    paths:
      - bloom.html
      - bloom.css
      - bloom.js
      - bloom-geometry.js
      - bloom-registry.js
      - tools/verify-bloom-export.mjs
      - tools/bloom-export-shards.mjs
      - tools/bloom-wall-thickness.mjs
      - tools/bloom-combination-gate.mjs
      - tools/verify-bloom-tube.mjs
      - tools/verify-bloom-arc-stability.mjs
      - tools/verify-bloom-infill.mjs
      - tools/verify-bloom-rim-owner.mjs
      - tools/verify-bloom-hole-rim.mjs
      - tools/verify-bloom-infill-margin.mjs
      - tools/verify-bloom-infill-budget.mjs
      - tools/verify-bloom-stem-channel.mjs
      - tools/verify-bloom-stem-nodes.mjs
      - tools/bloom-sagitta.mjs
      - tools/bloom-harness.mjs
      - tools/bloom-self-intersection.mjs
      - tools/verify-bloom-census-adjacency.mjs
      - tools/chromium-harness.mjs
      # THE SIX THE GATE REACHES THROUGH IMPORTS (C19, the gate-coverage
      # session). None runs from a `run:` line; every one is live in this job:
      #   bloom-crowding            <- verify-bloom-export (the crowding flag's
      #                                own R1 validity assertion on every row)
      #   bloom-first-slot          <- bloom-harness (the L family's Node-side
      #                                rebuild) and verify-bloom-infill
      #   bloom-infill-wall         <- verify-bloom-infill (I11) and
      #                                bloom-combination-gate
      #   bloom-plan-coverage       <- verify-bloom-export (coverage R1 on
      #                                every row, asserted on the incurve rows)
      #   bloom-rim-roundness-lib   <- verify-bloom-infill (I12)
      #   bloom-solid-angle-coverage<- verify-bloom-export (solid R1/R5 on
      #                                every row)
      - tools/bloom-crowding.mjs
      - tools/bloom-first-slot.mjs
      - tools/bloom-infill-wall.mjs
      - tools/bloom-plan-coverage.mjs
      - tools/bloom-rim-roundness-lib.mjs
      - tools/bloom-solid-angle-coverage.mjs
      # THE D14 GATES the `gates` job runs, and the mutant table whose anchors it checks.
      - tools/verify-bloom-leaf-decoupled.mjs
      - tools/verify-bloom-sepal-decoupled.mjs
      - tools/verify-bloom-surface-offstation.mjs
      - tools/verify-bloom-rim-arc.mjs
      - tools/verify-bloom-infill-conform.mjs
      - tools/verify-bloom-infill-metric.mjs
      - tools/verify-bloom-edge-profile.mjs
      - tools/verify-bloom-apex-mutants.mjs
  workflow_dispatch: {}

# A SUPERSEDED COMMIT'S GREEN RUN SHOULD NEVER HAVE BEEN QUOTABLE (Eva,
# session 17). Two runs of this workflow on PR #149 started two minutes
# apart and both ran to completion on a four-CPU runner; the older one was
# already answering a question nobody was asking. The group is keyed to the
# workflow AND the ref so it can never cancel across PRs, and the final head
# always runs to completion — safe by construction. It also enforces a
# discipline already agreed: a run on a commit that has been superseded is
# not evidence about the head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# THE MATRIX IS SHARDED, AND ITS COVERAGE IS PROVED RATHER THAN ASSUMED (read
# tools/bloom-export-shards.mjs's header). One job ran 342 minutes on b4088e3
# (run 36324870437: 26 min of Node preflight, 315 min of matrix) against
# GitHub's 360-minute job limit, with no instrument able to tell SLOW from
# HUNG. So there are three jobs:
#   preflight  — every Node-only instrument, unchanged, in order;
#   shard      — the matrix split EIGHT ways by `shardOf(index, n)`, each shard
#                writing a census of what it attempted, reached and refused;
#   verdict    — reconciles every census against its OWN buildMatrix() (every
#                row in exactly one shard, none in two, none in none) and
#                assembles the one verdict through the same `summarize()` the
#                unsharded gate uses, over the UNION. It runs `if: always()`,
#                so a shard that crashed or timed out is a named finding
#                rather than a job nobody reads.
# EVERY JOB HAS AN EXPLICIT TIMEOUT, well under GitHub's 360, so a hang is
# DECLARED by the timeout and shows up in the verdict as a shard with no
# census. The preflight runs in PARALLEL with the shards: a red preflight is
# still red within its own ~26 minutes, and serialising it would add that to
# every green run's wall time.
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth 0 IS FOR CA5 AND NOTHING ELSE, AND A SHALLOW FETCH CANNOT
      # REPLACE IT. On a pull_request `actions/checkout` takes refs/pull/N/merge
      # at depth 1, so there is no origin/<base> ref and no common ancestor —
      # `git diff origin/main...HEAD` is a merge-base diff and fails outright
      # (measured: run 35743356440, "ambiguous argument 'origin/main...HEAD'").
      # Deepening to a fixed depth would work until a branch forked further back
      # and then go red for a reason that has nothing to do with the geometry,
      # so it is the whole history: 62 MB and 54 commits against a job that runs
      # for hours. Every other step here reads the working tree and no git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The wall instrument rides in this workflow rather than in a sixth of its
      # own: it is the same question (print safety), it is Node-only and takes
      # seconds, and a gate a developer has to remember to run is not a safety
      # net. It runs FIRST because it needs no browser — a red here is worth
      # knowing before spending four minutes on Chromium.
      - name: The emitted sheet must be as thick as it says (V1-V4)
        run: node tools/bloom-wall-thickness.mjs
      - name: ... and those four assertions must be able to fail
        run: node tools/bloom-wall-thickness.mjs --negative-control
      # THE COMBINATION GATE rides here for the wall instrument's own three
      # reasons — the same question (print safety), Node-only, seconds — and
      # it rides in THIS workflow rather than a sixth of its own because a
      # separate workflow would buy a faster GREEN and cost a slower RED: a
      # step in this job fails the job in under a minute, before the four
      # minutes of Chromium, whereas its own workflow would run in parallel
      # with a three-hour matrix that nothing would then stop. It goes AFTER
      # the wall instrument because it IMPORTS `measureWall` from it: a red
      # there is a red about the measure itself, and reading that first is
      # what keeps this gate's red about the geometry.
      #
      # IT DOES NOT NEED THE HARNESS and so it does not need playwright —
      # `tools/bloom-harness.mjs` imports `playwright-core` at MODULE LOAD,
      # which is what pins ST9's witness after the npm install; this gate
      # imports the geometry, the registry and the wall instrument and
      # nothing else, so it can run before it.
      - name: No PRODUCT of two controls may close the printable gap (CG0-CG7)
        run: node tools/bloom-combination-gate.mjs
      - name: ... and every one of those eight clauses must be able to fail
        run: node tools/bloom-combination-gate.mjs --control
      # EVERY SHIPPED DEFAULT CLEARS THE PRINTABLE BAR (DB0-DB2; Eva's standing
      # rule, inflorescence build 3): the registry's default and each guarded
      # feature's ruled-defaults row, pinned by name to the matrix, through
      # the combination gate's own measures. Rides here for the same reasons
      # as the gate above it — Node-only, the same owners, half a minute.
      - name: Every shipped default clears the printable bar (DB0-DB2)
        run: node tools/verify-bloom-defaults-bar.mjs
      - name: ... and that clause must be able to fail
        run: node tools/verify-bloom-defaults-bar.mjs --control
      # THE TUBE (corolla fusion, TU0-TU6) rides here for the wall instrument's
      # own reasons — the same question (one printable solid), Node-only, about
      # four minutes with its must-fails — and is OWED because both STL gates
      # are blind to what the tube is for: a ring that never reaches a fused
      # seam, a slit fused shut, a ring drawn on its petals' surface and a notch
      # that exists in one mode only all export watertight and as one piece. It
      # imports the geometry, the registry and the self-intersection census and
      # NOT the harness, so it runs before the npm install.
      - name: The tube is closed where fused, open at a slit, and drawn once (TU0-TU6)
        run: node tools/verify-bloom-tube.mjs
      - name: ... and those clauses must be able to fail
        run: node tools/verify-bloom-tube.mjs --control
      # THE ARC'S NEAR-ZERO BRANCH cannot be a matrix row: no slider reaches the
      # band (spine curl steps by 5 degrees) and `applyConfig`'s read-back would
      # refuse one if a row tried. So the witness calls the geometry directly,
      # and it rides HERE for the wall instrument's own two reasons — the same
      # question (a blade folded through itself is not printable), Node-only,
      # under a minute — and before the npm install because it imports
      # playwright not at all: `bloom-self-intersection.mjs` and the geometry,
      # and nothing else.
      - name: The uniform arc must be stable as its curvature goes to zero (AS0-AS4)
        run: node tools/verify-bloom-arc-stability.mjs
      - name: ... and those clauses must be able to fail
        run: node tools/verify-bloom-arc-stability.mjs --negative-control
      # THE INFILL (I0-I7) rides here for the same three reasons and is OWED for
      # a fourth that the others are not: both STL gates are structurally blind
      # to nearly all of it. A pattern cut at the wrong density, a hole under
      # the ruled bar, a metric plan that fell back to the flat one, a cell
      # whose hole was never cut and a MATERIAL MASK that calls a hole solid all
      # export watertight, as one connected piece, with no degenerate triangle —
      # the mask most of all, because a mask that lies in that direction makes
      # V5 green on a row it should redden. It imports the geometry, the
      # registry, `bloom-first-slot.mjs` and the self-intersection census and
      # NOT the harness, so it runs before the npm install like the three above.
      - name: The Voronoi infill must be the pattern it reports (I0-I7)
        run: node tools/verify-bloom-infill.mjs
      - name: ... and every one of those clauses must be able to fail
        run: node tools/verify-bloom-infill.mjs --negative-control
      # S5: every rim the bloom closes has ONE owner (emitRimLoop), and the
      # hole rims are beads rather than walls. Both are Node-only and import
      # neither the harness nor playwright, so they run beside the I family.
      - name: Every rim has one owner — emitRimLoop (O1-O3)
        run: node tools/verify-bloom-rim-owner.mjs --negative-control
      - name: The hole rims take the edge profile (H0-H3)
        run: node tools/verify-bloom-hole-rim.mjs
      - name: ... and those clauses must be able to fail
        run: node tools/verify-bloom-hole-rim.mjs --quick --negative-control
      # THE INFILLED PETAL'S OUTER MARGIN TAKES THE BEAD (MB0-MB2). Both STL
      # gates are blind to a flat wall, a wrong radius, a skin that stops in the
      # wrong place and a margin whose bead never engaged: all export watertight
      # and as one piece. Node-only, beside the hole-rim gate for its reasons.
      - name: The infilled margin takes the edge profile (MB0-MB2)
        run: node tools/verify-bloom-infill-margin.mjs
      - name: ... and those clauses must be able to fail
        run: node tools/verify-bloom-infill-margin.mjs --quick --negative-control
      # A SHARED CORNER MUST READ AS TOPOLOGY AND A REAL FOLD MUST STILL READ AS
      # A FOLD (CA0-CA3). X2 in this gate turns the census's count into a verdict,
      # and a count that is too LOW looks exactly like a clean solid — so the
      # adjacency rule the census decides that with is owed a witness that can
      # see it, and nothing in the matrix can. It rides here for arc-stability's
      # own three reasons: the same question, Node-only, seconds, and it imports
      # playwright not at all — `bloom-self-intersection.mjs` and the geometry,
      # and nothing else. The stored pairs are PR #278's, read-only; none of that
      # geometry is merged.
      - name: A shared corner is not a fold (CA0-CA3)
        run: node tools/verify-bloom-census-adjacency.mjs
      - name: ... and those clauses must be able to fail
        run: node tools/verify-bloom-census-adjacency.mjs --negative-control
      # AND THE SCOPE IS CHECKED HERE RATHER THAN BY HAND. A predeclared
      # allowlist asserted afterwards by the only party who could have broken it
      # is a claim; asserted by the gate on every run it is evidence. It refuses
      # an empty diff, so it cannot pass by having no subject.
      #
      # IT IS A CLAIM ABOUT A PR'S DIFF AGAINST ITS BASE, so it runs on a
      # pull_request and on nothing else. This workflow also fires on a push to
      # main and on a dispatch, where `github.base_ref` is empty: the base would
      # resolve to origin/main, HEAD would BE origin/main, and the diff would be
      # empty — which CA5 refuses as vacuous, correctly, and which would have
      # reddened every post-merge run of this gate. Caught by reading the step's
      # other triggers rather than by a failure; it has never run on main.
      #
      # AND IT IS GATED ON THE CENSUS RULE ITSELF HAVING MOVED (the edge-profile
      # PR, #278). As written above it fired on EVERY pull request, and its
      # subject is the diff of THE PR IT IS RUNNING ON — so on #279 it asserted
      # #279's own scope and passed, and on the next PR to touch geometry it
      # asserted that no bloom PR may ever change `bloom-geometry.js`, which is
      # not a property any future PR can have. Measured on #278: 16 strays,
      # red at this step, before the browser install and the matrix. The
      # allowlist's own comment says the scope it holds is GEOMETRY, which is
      # exactly why it cannot be a standing gate over PRs that change geometry.
      #
      # The step keeps its subject by running when `bloom-self-intersection.mjs`
      # is in the diff: a PR that changes what the census COUNTS is still held
      # to the allowlist, and a PR that does not touch the census is not. The
      # only PR it could ever catch — one smuggling geometry while changing the
      # census rule — is still caught. `--scope` also remains a hand-run tool.
      - name: ... and only census and instrument files moved
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/ca5-files.txt
          if grep -qx 'tools/bloom-self-intersection.mjs' /tmp/ca5-files.txt; then
            node tools/verify-bloom-census-adjacency.mjs --scope --base origin/${{ github.base_ref || 'main' }}
          else
            echo "CA5 scope: this PR does not change tools/bloom-self-intersection.mjs, so the census rule is not its subject — skipped. (The allowlist is about a CENSUS PR's scope; see the note above.)"
          fi
      # playwright alone, at an exact version. It pins the exact playwright-core it
      # needs and npm hoists it, so the harness's `import 'playwright-core'` and the
      # browser that `npx playwright install` downloads can never disagree. Both
      # unpinned raced npm on Sep 4: playwright-core 1.63.0 published nineteen
      # seconds before a run while the playwright CLI was still 1.62.1, and every job
      # that launches a browser died at launch (build 1243 wanted, 1234 installed);
      # two minutes later the registry listed playwright 1.63.0 as latest with its
      # tarball still 404, and an unpinned install could not fetch it at all. Bump
      # the pin by hand, in every workflow at once, with playwright-core's twin in
      # bloom-frozen-matrices.yml.
      - name: Install render deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      # ST9 reads the EXPORTED FILE and rides in this gate on every sphere-stem
      # row, and the mutant table cannot fire it at all (it calls
      # `stemAssertions`, never `stemChannelAssertions`). So its witness rides
      # here for the wall instrument's own reasons — the same question, Node-only,
      # fifteen seconds — because a clause that has silently stopped being able to
      # fire makes THIS GATE green on a broken channel.
      #
      # IT SITS AFTER THE npm INSTALL AND BEFORE THE BROWSER, not beside the wall
      # instrument, and that is not a preference: it imports
      # `stemChannelAssertions` from tools/bloom-harness.mjs, which imports
      # `playwright-core` at MODULE LOAD. Run any earlier and it dies on a missing
      # module, red for a reason that has nothing to do with the channel. The wall
      # instrument can go first because it imports the harness not at all — that is
      # what buys it the position, not the fact that it needs no browser.
      # Duplicating ST9 here to avoid the import is the one thing it must not do:
      # the clause under test would stop being the clause that ships.
      - name: ST9 must be able to fire on the channel's two defects
        run: node tools/verify-bloom-stem-channel.mjs
      - name: ... and it must be able to fail
        run: node tools/verify-bloom-stem-channel.mjs --control
      # THE STEM'S NODES (#299's port): ST12's four arms, each planted into
      # records the shipped geometry builds and required to fire BY ITS OWN
      # MESSAGE through stemNodeClauses — the function both STL gates call.
      # Here after the npm install for ST9's reason (it imports the harness,
      # which imports playwright-core at load) and before the browser.
      - name: ST12 — every arm of the stem-node clause must be able to fail
        run: node tools/verify-bloom-stem-nodes.mjs
      # THE STEM'S CUT (ruling 7, stem session 3): SC0-SC3, ST10's two cut
      # arms, ST1's cut band, ST12's cut ladder and ID4's cut pin, each planted
      # into records the shipped geometry builds and required to fire BY ITS
      # OWN MESSAGE through the clauses both STL gates call. Here beside the
      # stem-nodes must-fail for the same reason (it imports the harness).
      # Added AFTER frozen/phase52 was dispatched from main (docs/bloom-stem-cut-outcome.md).
      - name: SC0-SC3 — every arm of the stem-cut clauses must be able to fail
        run: node tools/verify-bloom-stem-cut.mjs
      # S5: every infilled row under the export budget on its own mesh. It
      # imports the harness (for the matrix), which imports playwright at
      # module load, so it sits after the npm install.
      - name: Every infilled state is under the triangle budget (B0-B2)
        run: node tools/verify-bloom-infill-budget.mjs --negative-control

  # THE GATES THAT RAN IN NO WORKFLOW (D14, the gate-coverage session). Eight
  # bloom gates carried must-fail controls and were run by hand or not at all;
  # three of them were RED on main when first run (offstation, rim-arc,
  # edge-profile — all since #283, eleven merges earlier) and nothing said so.
  # Seven ride here, each followed by its OWN control, so a control that has
  # stopped being able to fail reads red in the same job. Runtimes measured on
  # the session's box, gate + control: leaf 9+9 s, sepal 19+19, offstation
  # 1+1, rim-arc 22+23, infill-conform 76+247, infill-metric 80+377,
  # edge-profile 311+46 — about 21 min in all, which is why this is its own
  # job in PARALLEL with the preflight rather than 21 more minutes on its
  # critical path. The eighth, the apex mutant table, is a four-hour sweep and
  # has its own workflow (bloom-apex-mutants.yml); its anchor pre-check runs
  # here on every push, in seconds.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      - name: A leaf does not move when a petal control does
        run: node tools/verify-bloom-leaf-decoupled.mjs
      - name: ... and its control finds the neutered override
        run: node tools/verify-bloom-leaf-decoupled.mjs --control
      - name: A sepal's blade does not move when a petal control does
        run: node tools/verify-bloom-sepal-decoupled.mjs
      - name: ... and its control finds the neutered twin
        run: node tools/verify-bloom-sepal-decoupled.mjs --control
      - name: The surface evaluator is right where the mesh does not sample (A1-A4, B, C)
        run: node tools/verify-bloom-surface-offstation.mjs
      - name: ... and its control fires on all three legs
        run: node tools/verify-bloom-surface-offstation.mjs --control
      - name: The rim query is the exported mesh's own rim (R1-R5)
        run: node tools/verify-bloom-rim-arc.mjs
      - name: ... and its control fires R1a/b/c, R3 and R5
        run: node tools/verify-bloom-rim-arc.mjs --control
      - name: The infill's cells conform to the surface (C0-C3)
        run: node tools/verify-bloom-infill-conform.mjs
      - name: ... and its five mutants behave
        run: node tools/verify-bloom-infill-conform.mjs --negative-control
      - name: Every length the infill plan uses is a surface length (M0-M4)
        run: node tools/verify-bloom-infill-metric.mjs
      - name: ... and its mutants behave
        run: node tools/verify-bloom-infill-metric.mjs --negative-control
      # The edge profile drives a browser (its rows are the smoke subset's).
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: The petal's rim is a taper and a bead (E0-E6)
        run: node tools/verify-bloom-edge-profile.mjs
      - name: ... and its six mutants redden exactly the clauses they name
        run: node tools/verify-bloom-edge-profile.mjs --control
      - name: Every apex mutant's anchor matches exactly once (the sweep is bloom-apex-mutants.yml's)
        run: node tools/verify-bloom-apex-mutants.mjs --anchors

  shard:
    runs-on: ubuntu-latest
    # 315 min of matrix / 8 is ~40 min a shard on the S5 head; 150 is ~3.7x that
    # and still 210 minutes under GitHub's own limit. A shard that reaches it is
    # a HANG declared, and the verdict job names it.
    timeout-minutes: 150
    strategy:
      # Every shard runs to completion whatever another does: a shard cancelled
      # by fail-fast writes no census, and the verdict would then report a
      # coverage hole that is only an artefact of the cancellation.
      fail-fast: false
      matrix:
        # MUST be 0..SHARDS-1. A shard missing from this list writes no census
        # and the verdict FAILS naming it; an extra one is refused at launch.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install render deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Every config in this shard must export watertight (boundary edges = 0)
        run: node tools/verify-bloom-export.mjs --shard ${{ matrix.shard }}/$SHARDS --census census/census-${{ matrix.shard }}.json
      # always(): a shard that FAILED still wrote its census, and the verdict
      # needs it to say what failed; a shard that crashed wrote none, and the
      # verdict says that instead.
      - name: Keep this shard's census for the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.shard }}
          path: census/
          if-no-files-found: ignore
          retention-days: 14

  verdict:
    runs-on: ubuntu-latest
    needs: [preflight, gates, shard]
    if: always()
    timeout-minutes: 20
    env:
      SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The harness imports playwright-core at module load; no browser is needed.
      - name: Install deps (pinned three + playwright)
        run: npm i --no-save three@0.161.0 playwright@1.62.1
      - name: The shard selector partitions the matrix
        run: node tools/bloom-export-shards.mjs --plan $SHARDS
      - name: ... and the reconciliation must fail when a row goes missing
        run: node tools/bloom-export-shards.mjs --negative-control --shards $SHARDS
      - uses: actions/download-artifact@v4
        with:
          pattern: census-*
          path: census/
          merge-multiple: true
      - name: Every row in exactly one shard, and ONE verdict over all of them
        run: node tools/bloom-export-shards.mjs --merge census --shards $SHARDS
      - name: ... and the preflight instruments passed
        if: always() && needs.preflight.result != 'success'
        run: |
          echo "preflight: ${{ needs.preflight.result }} — the Node-only instruments did not pass, so this gate is not green whatever the matrix says."
          exit 1
      - name: ... and the D14 gates passed
        if: always() && needs.gates.result != 'success'
        run: |
          echo "gates: ${{ needs.gates.result }} — a gate that used to run in no workflow is red, so this gate is not green whatever the matrix says."
          exit 1
