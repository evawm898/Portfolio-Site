# Panel size-class library for the dress shell. Units: mm (enforced).
#
# Panel-local frame: origin at the OUTLINE's top-left corner, +x right
# (width), +y down (height), viewed face-on from outside the shell. Seated
# at rotation 0, local +x follows +e_theta (toward the wearer's left) and
# local +y follows +e_s (hemward); rotation 180 flips both. Identity and
# 180-degree rotation are the ONLY transforms — the connector position is
# FIXED per class and can never be mirrored.
#
# Per class:
#   outline:      physical bounding rectangle, width x height
#   thickness:    panel thickness (drives mount-height stacking)
#   active_area:  visible display rectangle + offset from the outline origin
#                 (offsets are deliberately not centered where real modules
#                 aren't — twin derivation must cope, never mirror)
#   connector:
#     origin:      [x, y] point ON the outline perimeter where the flex exits
#     exit_vector: [x, y] direction the flex leaves (normalized on load)
#     escape_mm:   clear run required along the exit path; used by the
#                  geometric legality check (path must stay on the panel's
#                  piece: not cross the side seams at theta = +-90, not run
#                  off the top or hem edge) and later by occlusion checks
#
# Dimensions are placeholders for real datasheet numbers.

units: mm

classes:
  XS:
    outline: {width: 20.0, height: 30.0}
    thickness: 0.8
    active_area: {width: 16.0, height: 25.0, offset: [1.6, 2.5]}
    connector: {origin: [10.0, 0.0], exit_vector: [0.0, -1.0], escape_mm: 18.0}

  S:
    outline: {width: 30.0, height: 45.0}
    thickness: 1.0
    active_area: {width: 25.6, height: 39.0, offset: [2.2, 3.0]}
    # side exit: the case that makes twin rotation selection non-trivial
    connector: {origin: [0.0, 22.5], exit_vector: [-1.0, 0.0], escape_mm: 25.0}

  M:
    outline: {width: 45.0, height: 70.0}
    thickness: 1.4
    # active area high in the outline (driver strip below): vertical offset
    # dominates, so twins of M prefer keeping the source rotation
    active_area: {width: 40.0, height: 63.0, offset: [2.4, 2.0]}
    connector: {origin: [22.5, 70.0], exit_vector: [0.0, 1.0], escape_mm: 30.0}

  L:
    outline: {width: 60.0, height: 95.0}
    thickness: 1.8
    active_area: {width: 54.0, height: 87.0, offset: [3.2, 4.0]}
    connector: {origin: [30.0, 0.0], exit_vector: [0.0, -1.0], escape_mm: 30.0}
