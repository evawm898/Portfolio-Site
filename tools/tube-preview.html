<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tube preview (scratch)</title>
<!--
  THROWAWAY PREVIEW of the scratch closed-ring TUBE prototype (PR #323). Not linked
  from anywhere, not shipped, not a gate. It builds through tools/bloom-tube-core.mjs —
  the SAME four anchored patches over the shipped bloom-geometry.js that the sheets
  and the sweep use — imported here from a Blob URL instead of a temp file. ROUND
  only. Everything not on the panel is the bloom's default design (bloom-registry.js
  DEFAULTS). Display only: the normals are three's toCreasedNormals in both modes,
  not bloom.js's export-normal path, and the ring is drawn with a polygon offset so a
  petal lying ON it does not z-fight (the geometry is untouched).
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "three/addons/utils/BufferGeometryUtils.js": "../bloom-vendor/BufferGeometryUtils.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #101012; color: #d6dcd4; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 10px; left: 10px; width: 300px; max-height: calc(100vh - 20px); overflow: auto; background: rgba(20,20,24,0.92); border: 1px solid #333; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; }
  h1 { font-size: 13px; margin: 0 0 4px; color: #f0e2c0; }
  .note { color: #8a8f88; font-size: 11px; margin: 0 0 10px; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; }
  .row output { color: #f0e2c0; }
  input[type=range] { width: 100%; }
  #readout { margin-top: 10px; padding-top: 8px; border-top: 1px solid #333; white-space: pre-wrap; font-size: 12px; }
  .warn { color: #ffb070; }
  .err { color: #ff7a6a; }
  #busy { position: fixed; top: 10px; right: 12px; color: #f0e2c0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>TUBE preview — scratch, PR #323</h1>
  <p class="note">The closed-ring tube prototype on the bloom's default design. ROUND only. Drag to orbit, wheel to zoom. Lighter = the ring.</p>
  <div class="row"><label>TUBE <output id="tubeOut"></output></label><input id="tube" type="range" min="0" max="1" step="1" value="0"></div>
  <div class="row"><label>fusion height h <output id="hOut"></output></label><input id="h" type="range" min="0.10" max="0.70" step="0.01" value="0.25"></div>
  <div class="row"><label>BLEND <output id="blendOut"></output></label><input id="blend" type="range" min="0" max="1" step="0.05" value="0"></div>
  <div class="row"><label>Petals <output id="petalCountOut"></output></label><input id="petalCount" type="range"></div>
  <div class="row"><label>Petal cup <output id="petalCupOut"></output></label><input id="petalCup" type="range"></div>
  <div class="row"><label>Cross-section roll <output id="petalRollOut"></output></label><input id="petalRoll" type="range"></div>
  <div class="row"><label>Twist <output id="petalTwistOut"></output></label><input id="petalTwist" type="range"></div>
  <div class="row"><label>Spine curl <output id="petalSpineCurlOut"></output></label><input id="petalSpineCurl" type="range"></div>
  <div class="row"><label><span><input id="printPreview" type="checkbox"> print preview</span></label></div>
  <div class="row"><button id="reset">reset to defaults</button></div>
  <div id="readout">loading…</div>
</div>
<div id="busy"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import * as R from '../bloom-registry.js';
import { setGeometryLoader, buildTube, divisorsOf, notchCorner } from './bloom-tube-core.mjs';

/* the browser loader: the shipped source fetched as text, the patched copy imported from a Blob URL */
setGeometryLoader({
  read: async () => { const r = await fetch(new URL('../bloom-geometry.js', import.meta.url)); if (!r.ok) throw new Error(`bloom-geometry.js: HTTP ${r.status}`); return r.text(); },
  load: async (src) => import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))),
});

const $ = (id) => document.getElementById(id);
const FORM = ['petalCount', 'petalCup', 'petalRoll', 'petalTwist', 'petalSpineCurl'];
for (const id of FORM) { const c = R.CONTROLS.find((x) => x.id === id); const el = $(id); el.min = c.min; el.max = c.max; el.step = c.step; el.value = R.DEFAULTS[id]; }

/* TUBE: stepped over the valid k for the current petal count. The ASKED k is kept
   across petal-count changes; the BUILT k is the nearest valid one (the snap). */
let askedK = 0, askedFree = false;
const ksFor = (n) => [0, ...divisorsOf(n)];
const kLabel = (k, n) => (k === 0 ? 'TUBE' : k === n ? 'FREE' : `K ${k} (${k} panel${k > 1 ? 's' : ''} of ${n / k})`);
function builtK(n) {
  if (askedFree) return n;
  const ks = ksFor(n); if (ks.includes(askedK)) return askedK;
  return ks.reduce((best, k) => (Math.abs(k - askedK) < Math.abs(best - askedK) ? k : best), ks[0]);
}
function syncTube() {
  const n = Number($('petalCount').value), ks = ksFor(n), k = builtK(n);
  $('tube').max = ks.length - 1; $('tube').value = ks.indexOf(k);
  $('tubeOut').textContent = kLabel(k, n);
}
$('tube').addEventListener('input', () => {
  const n = Number($('petalCount').value), k = ksFor(n)[Number($('tube').value)];
  askedK = k; askedFree = k === n; syncTube(); requestBuild();
});
const fmt = { h: (v) => Number(v).toFixed(2), blend: (v) => Number(v).toFixed(2), petalCup: (v) => Number(v).toFixed(2) };
for (const id of ['h', 'blend', ...FORM]) {
  const show = () => { $(`${id}Out`).textContent = (fmt[id] || String)($(id).value); };
  show();
  $(id).addEventListener('input', () => { show(); if (id === 'petalCount') syncTube(); requestBuild(); });
}
$('printPreview').addEventListener('change', requestBuild);
$('reset').addEventListener('click', () => {
  for (const id of FORM) { $(id).value = R.DEFAULTS[id]; $(`${id}Out`).textContent = (fmt[id] || String)($(id).value); }
  $('h').value = 0.25; $('blend').value = 0; $('hOut').textContent = '0.25'; $('blendOut').textContent = '0.00';
  askedK = 0; askedFree = false; $('printPreview').checked = false; syncTube(); requestBuild();
});
syncTube();

/* ---- the scene: Z-up like the bloom ---- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101012);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000); camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334433, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(40, -60, 80); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-60, 40, 20); scene.add(fill);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb9cdbf, roughness: 0.62, metalness: 0.05, side: THREE.DoubleSide });
const ringMat = new THREE.MeshStandardMaterial({ color: 0xe8ead8, roughness: 0.62, metalness: 0.05, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const group = new THREE.Group(); scene.add(group);
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

function geoOf(pos) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const out = toCreasedNormals(g, 60 * Math.PI / 180); g.dispose(); return out;
}

/* ---- the build: one at a time, coalescing whatever moved while it ran ---- */
const state = window.__tube = { builds: 0, building: false, pending: false, tris: null, free: null, k: null, error: null, digest: null, framed: false, lastMs: null };
async function requestBuild() { state.pending = true; if (!state.building) await runBuilds(); }
async function runBuilds() {
  state.building = true;
  while (state.pending) {
    state.pending = false;
    $('busy').textContent = 'building…';
    const n = Number($('petalCount').value), k = builtK(n);
    const set = {}; for (const id of FORM) set[id] = Number($(id).value);
    const opt = { shape: 'ROUND', k, h: Number($('h').value), blend: Number($('blend').value), exportMode: $('printPreview').checked };
    const t0 = performance.now();
    try {
      await new Promise((r) => setTimeout(r, 0));
      const b = await buildTube(set, opt);
      const ms = performance.now() - t0;
      const ringTris = b.free ? 0 : b.ringReport.reduce((a, x) => a + x.ringTris, 0);
      const split = (b.tubeTris - ringTris) * 9, P = b.positions;
      for (const m of [...group.children]) { m.geometry.dispose(); group.remove(m); }
      group.add(new THREE.Mesh(geoOf(P.slice(0, split)), bodyMat));
      if (ringTris) group.add(new THREE.Mesh(geoOf(P.slice(split)), ringMat));
      let dg = 0; for (let i = 0; i < P.length; i += 7) dg = (dg * 31 + Math.round(P[i] * 1e4)) % 2147483647;
      Object.assign(state, { builds: state.builds + 1, tris: b.tubeTris, free: b.plainTris, k, error: null, digest: `${P.length}:${dg}`, lastMs: ms, opt, set });
      if (!state.framed) {
        const box = new THREE.Box3().setFromBufferAttribute(group.children[0].geometry.getAttribute('position'));
        const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
        controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.62, -0.72, 0.55).normalize().multiplyScalar(r * 3.1)); controls.update();
        state.framed = true;
      }
      const askedNote = !askedFree && askedK !== k ? `\n<span class="warn">SNAP: asked K ${askedK} does not divide ${n} petals — built ${kLabel(k, n)} (K ${k})</span>` : '';
      let extra = '';
      if (!b.free) {
        const rr = b.ringReport[0], nc = notchCorner(b);
        extra = `\nring to u ${rr.uTop.toFixed(3)} (row ${rr.rows - 1})` +
          `\nflare ${rr.flare.rows}/${rr.flare.need} rows` +
          `\nsinus ${nc.gapMm.toFixed(2)} mm — notch ${nc.engaged ? `r ${nc.r.toFixed(2)} mm, depth ${nc.depthMm.toFixed(2)} mm` : (nc.gapMm > 0 ? 'off (BLEND 0)' : 'inert (closed)')}`;
      }
      $('readout').innerHTML = `${opt.exportMode ? 'PRINT PREVIEW (export)' : 'LIVE'}\n` +
        `triangles ${b.tubeTris.toLocaleString()}  (FREE ${b.plainTris.toLocaleString()}, ${b.tubeTris - b.plainTris >= 0 ? '+' : ''}${(b.tubeTris - b.plainTris).toLocaleString()})\n` +
        `built ${kLabel(k, n)} — K ${k}${askedNote}${extra}\nbuild ${ms.toFixed(0)} ms · #${state.builds}`;
    } catch (e) {
      state.error = String(e && e.message || e);
      $('readout').innerHTML = `<span class="err">BUILD REFUSED: ${state.error.replace(/</g, '&lt;')}</span>\n(the previous mesh is still shown)`;
    }
    $('busy').textContent = '';
  }
  state.building = false;
}
requestBuild();
</script>
</body>
</html>
