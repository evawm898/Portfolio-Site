# panels.yaml — shared rigid-panel size-class registry
#
# Shared between the SKIRT and BODICE placement tools, which run in
# parallel sessions.
#
# CONTRACT — APPEND-ONLY:
#   - Add new size-class entries at the END of the size_classes list.
#   - Never modify, reorder, or delete existing entries; tools reference
#     them by id.
#   - Note: this file may have been created concurrently by either the
#     skirt or the bodice session. If two versions collide, merge by
#     keeping the union of entries (ids must stay unique) — do not drop
#     either side's classes.
#
# Schema (all dimensions in mm):
#   size_classes: list of
#     id:        unique short name (string)
#     width_mm:  rigid active-area width
#     height_mm: rigid active-area height
#
# Placement rule of thumb (chord rule, tol = allowed gap to the body):
#   a panel span L needs local min curvature radius R >= L^2 / (8 * tol).
#   Doubly curved zones cap the panel DIAGONAL; single-curved zones cap
#   only the width (the panel can run tall along the straight direction).

size_classes:
  - id: XS
    width_mm: 15
    height_mm: 25
  - id: S
    width_mm: 25
    height_mm: 40
  - id: M
    width_mm: 40
    height_mm: 60
  - id: L
    width_mm: 60
    height_mm: 90
  - id: XL
    width_mm: 80
    height_mm: 120
