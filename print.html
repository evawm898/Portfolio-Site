<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Line Art — Eva Maskalenko</title>
<meta name="description" content="Line-art stage for the print pipeline: silhouette and crease edges pulled live off the posed geometry.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Three.js via ES-module import map, pinned to the SAME version bloom.html
     already pins (0.161.0) so the two pages share one cached copy and any
     headless CDN intercept has one URL to fulfil. No bundler, no build step —
     the same no-build convention as the cards tool's jsPDF/JSZip tags. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<style>
  :root { --mono: "IBM Plex Mono", ui-monospace, monospace; }
  html, body { margin: 0; height: 100%; background: #0c0e0e; color: #d8dedd; }
  #print-canvas { display: block; width: 100vw; height: 100vh; }

  /* Debug panel — this session's only job beyond the viewport: prove the
     pivot node's extras survive GLTFLoader. It is scaffolding, not UI. */
  #print-debug {
    position: fixed; top: 0.9rem; left: 0.9rem; max-width: min(30rem, calc(100vw - 1.8rem));
    max-height: calc(100vh - 1.8rem); overflow: auto;
    font-family: var(--mono); font-size: 0.72rem; line-height: 1.65;
    background: rgba(10, 12, 12, 0.86); border: 1px solid #2b3333;
    padding: 0.75rem 0.9rem; border-radius: 2px;
  }
  #print-log { margin: 0; white-space: pre-wrap; font: inherit; }
  #print-debug b { color: #6fb7ae; font-weight: 500; }
  #print-debug .err { color: #e07a6a; }
  #print-marker-toggle {
    display: flex; align-items: center; gap: 0.45rem;
    margin-top: 0.85rem; padding-top: 0.7rem; border-top: 1px solid #222a2a;
    color: #96a2a1; cursor: pointer; user-select: none;
  }
  #print-marker-toggle input { accent-color: #6fb7ae; margin: 0; }
  /* `display: flex` above outranks the UA sheet's `[hidden] { display: none }`,
     so the attribute alone would NOT hide this row — it would offer a toggle
     for a marker that is not in the bundle. Measured: the gate's
     "toggle never offered" mutation passed until this rule existed. */
  #print-marker-toggle[hidden] { display: none; }

  /* The right-hand column. POSE and STYLIZE are SIBLING panels in it, not one
     box with two headings: the read-out top-left reports the bundle as
     shipped, POSE reports what the session has done to its shape, and STYLIZE
     reports how that shape is being drawn. Three different subjects.
     RIGHT side on purpose: the read-out panel is top-left and can grow to the
     full viewport height, so a bottom-left pose box collided with its marker
     toggle and swallowed the clicks (caught by the gate, not by eye). */
  #print-side {
    position: fixed; right: 0.9rem; top: 0.9rem;
    width: min(23rem, calc(100vw - 1.8rem));
    max-height: calc(100vh - 1.8rem); overflow: auto;
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  #print-pose, #print-stylize {
    font-family: var(--mono); font-size: 0.72rem; line-height: 1.6;
    background: rgba(10, 12, 12, 0.9); border: 1px solid #2b3333;
    padding: 0.7rem 0.9rem; border-radius: 2px; color: #96a2a1;
  }
  #print-pose[hidden], #print-stylize[hidden] { display: none; }
  .pose-title { color: #6fb7ae; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .pose-row { display: grid; grid-template-columns: 3.2rem 1fr 3.2rem; align-items: center; gap: 0.5rem; }
  .pose-row input[type=range] { width: 100%; accent-color: #6fb7ae; margin: 0; }
  .pose-row output { text-align: right; color: #c8d2d1; }
  .pose-hint { margin: 0.55rem 0 0.5rem; color: #6b7776; }
  #resetPose {
    background: none; border: 1px solid #2b3333; color: #96a2a1;
    font: inherit; padding: 0.25rem 0.65rem; cursor: pointer; border-radius: 2px;
  }
  #resetPose:hover { border-color: #6fb7ae; color: #c8d2d1; }
  #print-posestate {
    margin: 0.65rem 0 0; padding-top: 0.6rem; border-top: 1px solid #222a2a;
    white-space: pre-wrap; font: inherit; color: #96a2a1;
  }
  #print-canvas.dragging { cursor: grabbing; }

  /* STYLIZE. Same row grammar as POSE on purpose — one panel style for the
     whole stage — with a wider value column because these read-outs carry a
     unit as well as a number. */
  #print-artstate {
    margin: 0.65rem 0 0; padding-top: 0.6rem; border-top: 1px solid #222a2a;
    white-space: pre-wrap; font: inherit; color: #96a2a1;
  }
  #lineart-toggle {
    display: flex; align-items: center; gap: 0.45rem;
    margin-bottom: 0.6rem; color: #96a2a1; cursor: pointer; user-select: none;
  }
  #lineart-toggle input { accent-color: #6fb7ae; margin: 0; }
  /* the stylize read-outs carry a unit as well as a number */
  #print-stylize .pose-row { grid-template-columns: 3.4rem 1fr 4.4rem; }
</style>
</head>
<body>

<canvas id="print-canvas"></canvas>
<div id="print-debug">
  <pre id="print-log">loading…</pre>
  <!-- The bundle ships a `pivot_marker` sphere at the junction. It is the
       exporter's own diagnostic, not scene content, so it is hidden by
       default and this is how you get it back. View chrome only — nothing
       else reads it. -->
  <label id="print-marker-toggle" hidden>
    <input type="checkbox" id="showPivotMarker"> show pivot marker
  </label>
</div>

<div id="print-side">

<!-- POSE. The hinge ranges are NOT written here — they are read from the
     bundle's own rotation_limits_deg at load and stamped onto the inputs, so
     the constraint has one owner (the exporter) and re-tuning it is a bundle
     change, not a code change. -->
<div id="print-pose" hidden>
  <div class="pose-title">POSE</div>

  <div class="pose-row">
    <label for="droop">droop</label>
    <input type="range" id="droop" min="0" max="45" step="0.5" value="0">
    <output id="droopOut">0.0°</output>
  </div>
  <div class="pose-row">
    <label for="twist">twist</label>
    <input type="range" id="twist" min="-30" max="30" step="0.5" value="0">
    <output id="twistOut">0.0°</output>
  </div>

  <div class="pose-hint" id="poseHint">drag the dots on the stem to bend it</div>
  <button type="button" id="resetPose">reset pose</button>
  <pre id="print-posestate"></pre>
</div>

<!-- STYLIZE. Three sliders over ONE extraction: weight and pointillism are
     both how the extracted segments are drawn, detail is which of them exist.
     The line-art switch is view chrome in the same sense as the pivot marker —
     it changes what is drawn, never the pose. -->
<div id="print-stylize" hidden>
  <div class="pose-title">STYLIZE</div>

  <label id="lineart-toggle">
    <input type="checkbox" id="lineArt" checked> line art
  </label>

  <div class="pose-row">
    <label for="lineWeight">weight</label>
    <input type="range" id="lineWeight" min="0.5" max="6" step="0.1" value="1.6">
    <output id="lineWeightOut">1.6 px</output>
  </div>
  <div class="pose-row">
    <label for="lineDetail">detail</label>
    <input type="range" id="lineDetail" min="0" max="100" step="1" value="45">
    <output id="lineDetailOut">45</output>
  </div>
  <div class="pose-row">
    <label for="pointillism">dots</label>
    <input type="range" id="pointillism" min="0" max="100" step="1" value="0">
    <output id="pointillismOut">0%</output>
  </div>

  <pre id="print-artstate"></pre>
</div>
</div>

<script type="module" src="print.js"></script>
</body>
</html>
