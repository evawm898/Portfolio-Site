<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parametric Frame — Eva Maskalenko</title>
<meta name="description" content="Parametric Frame — ornamental frames and Gothic windows: a skeleton path with a molding profile swept along it, shaded as an engraving.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frame.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<main class="fr-stage" id="stage" aria-label="Frame drawing">
  <div class="fr-paper" id="paper"></div>
  <canvas class="fr-canvas3d" id="stage3d" hidden aria-label="The relief, as the STL will print it"></canvas>
</main>

<div class="fr-viewtoggle" id="viewToggle" aria-label="View: the engraving (SVG) or the relief (STL)">
  <button class="fr-btn is-on" data-view="svg" title="The engraving — exactly what Get SVG exports">Drawing</button>
  <button class="fr-btn" data-view="3d" title="The relief — exactly what Get STL exports, under the one fixed light">Relief</button>
</div>

<header class="fr-header">
  <a class="fr-back" href="index.html">&larr; Index</a>
  <div class="fr-eyebrow" style="margin-top:10px">EM / FRAME</div>
  <h1>Parametric Frame</h1>
  <p class="fr-sub">Phase 2b — an arch, a rectangle or an oval skeleton with a molding profile swept along it, printable as a relief (STL) and drawn as an engraving (SVG). Ornament, texture and ivy are later layers.</p>
</header>

<aside class="fr-panel fr-box" aria-label="Frame controls">
  <div class="fr-row"><button class="fr-btn" id="resetBtn">Reset</button><button class="fr-btn" id="advBtn" title="Show the Advanced-tier controls">Advanced</button><button class="fr-btn fr-btn--solid" id="exportStl" title="The relief, binary STL, millimetres — the primary output">Get STL &darr;</button><button class="fr-btn" id="exportSvg" title="The engraving — the secondary output">Get SVG &darr;</button></div>
  <div id="controls"></div>
  <div class="fr-readout" id="readout"></div>
</aside>

<script type="module" src="frame.js"></script>
</body>
</html>
